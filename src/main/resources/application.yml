custom:
  multi-databases:
    h2:
      url: jdbc:h2:file:./data/chatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password:
      driver-class-name: org.h2.Driver
    oracle:
      url: jdbc:oracle:thin:@localhost:1521:xe
      username: oracle_user
      password: secret
      driver-class-name: oracle.jdbc.OracleDriver
    postgres:
      url: jdbc:postgresql://localhost:5432/mydb
      username: myuser
      password: mypassword
      driver-class-name: org.postgresql.Driver
    derby:
      url: jdbc:derby:memory:mydb;create=true
      username:
      password:
      driver-class-name: org.apache.derby.iapi.jdbc.AutoloadedDriver
    fis:
      url: protocol=jdbc:fisglobal|database=ip
      username: user
      password: pass
      driver-class-name: fisglobal.jdbc.driver.ScDriver

spring:
  datasource:
    url: jdbc:h2:file:./data/chatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
chat:
  allowed-origin: ${CHAT_ALLOWED_ORIGIN:*}

server:
  application:
    name: InjectMapFromYAML
    url: http://injectmapfromyaml.dev
    description: How To Inject a map from a YAML File in Spring Boot
  config:
    ips:
      - 10.10.10.10
      - 10.10.10.11
      - 10.10.10.12
      - 10.10.10.13
    filesystem:
      - /dev/root
      - /dev/md2
      - /dev/md4
  users:
    root:
      username: root
      password: rootpass
    guest:
      username: guest
      password: guestpass
