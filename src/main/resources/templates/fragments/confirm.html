<div th:fragment="confirm">
    <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="appModalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="appModalMessage"></div>
                <div class="modal-footer" id="appModalFooter"></div>
            </div>
        </div>
    </div>

    <script>
        function showModal({title, message, buttons = []}) {
            document.getElementById("appModalTitle").innerText = title;
            document.getElementById("appModalMessage").innerHTML = message;

            const footer = document.getElementById("appModalFooter");
            footer.innerHTML = "";

            buttons.forEach(btn => {
                const b = document.createElement("button");
                b.className = "btn " + (btn.class || "btn-secondary");
                b.innerText = btn.text;
                if (btn.dismiss) b.setAttribute("data-bs-dismiss", "modal");
                b.onclick = () => {
                    if (btn.onClick) btn.onClick();
                };
                footer.appendChild(b);
            });

            const modalEl = document.getElementById("appModal");
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        }

        function showConfirm(message, onOk, onCancel) {
            showModal({
                title: "Xác nhận",
                message: message,
                buttons: [
                    { text: "Hủy", class: "btn-secondary", dismiss: true, onClick: onCancel },
                    { text: "Đồng ý", class: "btn-primary", dismiss: true, onClick: onOk }
                ]
            });
        }

        function showInfo(message, onOk) {
            showModal({
                title: "Thông báo",
                message: message,
                buttons: [
                    { text: "OK", class: "btn-primary", dismiss: true, onClick: onOk }
                ]
            });
        }

        function showError(message, onOk) {
            showModal({
                title: "Lỗi",
                message: `<span class="text-danger">${message}</span>`,
                buttons: [
                    { text: "Đóng", class: "btn-danger", dismiss: true, onClick: onOk }
                ]
            });
        }

        function showSuccess(message, onOk) {
            showModal({
                title: "Thành công",
                message: `<span class="text-success">${message}</span>`,
                buttons: [
                    { text: "OK", class: "btn-success", dismiss: true, onClick: onOk }
                ]
            });
        }
    </script>
</div>
