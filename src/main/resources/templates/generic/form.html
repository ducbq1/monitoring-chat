<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<head>
    <title th:text="'Form - ' + ${#strings.capitalize(requestUri)}">Form</title>
    <style>
        body {
            font-family: ui-sans-serif, system-ui, -apple-system;
            background-color: #f8f9fa;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1677ff;
            margin-bottom: 16px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
            background-color: #fff;
            border-radius: 0.75rem;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        label {
            font-weight: 600;
            font-size: 14px;
            text-transform: capitalize;
        }

        input, select {
            padding: 8px;
            border: 1px solid #dee2e6;
            border-radius: 0.35rem;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="checkbox"] {
            width: auto;
        }

        .btn {
            padding: 4px 10px;
            border-radius: 0.35rem;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .btn-primary {
            background: #1677ff;
            color: #fff;
        }

        .btn-secondary {
            background: #6c757d;
            color: #fff;
        }

        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-start;
            margin-top: 12px;
        }
    </style>

</head>
<body>
<h2>Form</h2>

<form th:action="@{${requestUri}}" method="post"
      th:object="${record}">
    <div th:each="col : ${columns}">
        <label th:for="${col['field']}" th:text="${col['title']}"></label>
        <div th:switch="${col['type']}">

            <input th:case="'date'" type="date"
                   th:name="${col['field']}" th:id="${col['field']}"
                   th:value="${record[col['field']] != null
                      ? #temporals.format(record[col['field']], 'yyyy-MM-dd')
                      : #dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                   th:readonly="${col['readonly']}"
                   th:required="${col['required']}" />

            <input th:case="'datetime'" type="datetime-local"
                   th:name="${col['field']}" th:id="${col['field']}"
                   th:value="${record[col['field']] != null
                      ? #temporals.format(record[col['field']], 'yyyy-MM-dd''T''HH:mm')
                      : #dates.format(#dates.createNow(), 'yyyy-MM-dd''T''HH:mm')}"
                   th:readonly="${col['readonly']}"
                   th:required="${col['required']}" />

            <input th:case="'number'" type="number"
                   th:field="*{__${col['field']}__}" th:id="${col['field']}"
                   th:readonly="${col['readonly']}"
                   th:required="${col['required']}" />

            <input th:case="'boolean'" type="checkbox"
                   th:field="*{__${col['field']}__}" th:id="${col['field']}"
                   th:disabled="${col['readonly']}"
                   th:required="${col['required']}" />

            <input th:case="'text'" type="text"
                   th:field="*{__${col['field']}__}" th:id="${col['field']}"
                   th:readonly="${col['readonly']}"
                   th:required="${col['required']}" />

        </div>

    </div>

    <div class="mt-1 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="${listUri}" class="btn btn-secondary">Cancel</a>
    </div>
</form>

</body>
</html>
