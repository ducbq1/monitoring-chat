<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<head>
    <title th:text="'Form - ' + ${#strings.capitalize(requestUri)}">Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { display: flex; flex-direction: column; gap: 12px; max-width: 400px; }
        label { font-weight: bold; }
        input, select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 100%; }
        .btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-primary { background: #28a745; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }
    </style>
</head>
<body>
<h2>Form</h2>

<form th:action="@{${requestUri}}" method="post"
      th:object="${record}">
    <div th:each="col : ${columns}">
        <label th:for="${col['field']}" th:text="${col['name']}"></label>
        <input type="text" th:field="*{__${col['field']}__}" th:id="${col['field']}"/>
    </div>

    <div style="display:flex; gap:8px;">
        <button type="submit" class="btn btn-primary">Save</button>
        <div th:with="baseUri=${#strings.substring(requestUri,0,requestUri.lastIndexOf('/'))}">
            <a th:href="@{${baseUri}}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</form>

</body>
</html>
