<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<head>
    <title th:text="${table.metadata.title} + ' List'">Entity List</title>
    <style>
        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #1677ff;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
        }

        .section-title .db-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1f2937; /* text-gray-800 */
        }

        .section-title .database-name {
            margin-top: 2px;
            font-size: 0.95rem;
            color: #4b5563; /* text-gray-600 */
            background: #f9fafb; /* bg-gray-50 */
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            border: 1px solid #e5e7eb; /* subtle border */
        }

        .section-title .database-name span:first-child {
            font-weight: 500;
            color: #111827; /* darker text for db name */
        }

        .section-title .database-name span:not(:first-child) {
            color: #6b7280; /* lighter for dbType, version, driver */
        }

        .ant-table {
            background-color: #fff;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .ant-table thead {
            background-color: #1677ff;
            color: #fff;
        }

        .ant-table th {
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
            color: white;
            background-color: cornflowerblue;
            text-transform: capitalize;
        }

        .ant-table td {
            font-size: 14px;
            text-align: center;
            padding: 10px;
            vertical-align: middle;
        }

        .ant-table tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .ant-table tbody tr:hover {
            background-color: #e9ecef;
        }

        .ant-table th:last-child,
        .ant-table td:last-child {
            width: 120px;
            text-align: center;
            white-space: nowrap;
        }

        .badge-status {
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 0.35rem;
            display: inline-block;
            font-weight: 500;
        }

        .status-ok {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .status-down {
            background-color: #f8d7da;
            color: #842029;
        }

        .actions {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .btn-action .btn {
            padding: 4px 10px;
            border-radius: 0.35rem;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .pagination-container {
            background-color: #f8f9fa;
            border-radius: 0 0 0.75rem 0.75rem;
            padding: 10px;
        }

        .pagination .page-link {
            border-radius: 0.375rem !important;
            margin: 0 4px;
            font-size: 0.875rem;
            padding: 0.35rem 0.7rem;
        }
    </style>
</head>
<body>
<section class="container-fluid btn-action">
    <div class="section-title">
        <div class="db-title" th:text="${table.metadata.title}">Entity Title</div>
        <div class="database-name">
            <span th:text="${table.metadata.database.name}">db_name</span>
            (<span th:text="${table.metadata.table}">table_name</span>,
            <span th:text="${table.metadata.database.dbType}">dbType</span>,
            <span th:text="${table.metadata.database.version}">version</span>,
            <span th:text="${table.metadata.database.driver}">driver</span>)
        </div>
    </div>


    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{${requestUri} + '/create'}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Create New
        </a>

        <button class="btn btn-primary" type="button"
                data-bs-toggle="collapse" data-bs-target="#searchForm"
                aria-expanded="false" aria-controls="searchForm">
            <i class="bi bi-funnel"></i> Search Filters
        </button>
    </div>

    <div class="collapse show" id="searchForm">
        <form th:action="@{${requestUri}}" method="get" class="mb-3 p-3 border rounded bg-light">
            <div class="row g-2">
                <div class="col-md-3" th:each="col : ${table.columns}">
                    <label th:for="${'search_' + col['field']}" th:text="${col['title']}" class="form-label small fw-bold"></label>

                    <div th:switch="${col['type']}">
                        <!-- Text -->
                        <input th:case="'text'" type="text"
                               class="form-control form-control-sm"
                               th:name="${col['column']}"
                               th:value="${param[col['column']]}"
                               th:id="${'search_' + col['column']}"/>

                        <!-- Number -->
                        <input th:case="'number'" type="number"
                               class="form-control form-control-sm"
                               th:name="${col['column']}"
                               th:value="${param[col['column']]}"
                               th:id="${'search_' + col['column']}"/>

                        <!-- Date -->
                        <input th:case="'date'" type="date"
                               class="form-control form-control-sm"
                               th:name="${col['column']}"
                               th:value="${param[col['column']]}"
                               th:id="${'search_' + col['column']}"/>

                        <!-- DateTime -->
                        <input th:case="'datetime'" type="datetime-local"
                               class="form-control form-control-sm"
                               th:name="${col['column']}"
                               th:value="${param[col['column']]}"
                               th:id="${'search_' + col['column']}"/>

                        <!-- Boolean -->
                        <select th:case="'boolean'"
                                class="form-select form-select-sm"
                                th:name="${col['column']}"
                                th:id="${'search_' + col['column']}">
                            <option value="">-- All --</option>
                            <option value="true" th:selected="${param[col['column']] == 'true'}">Yes</option>
                            <option value="false" th:selected="${param[col['column']] == 'false'}">No</option>
                        </select>

                        <!-- Default -->
                        <input th:case="*"
                               type="text"
                               class="form-control form-control-sm"
                               th:name="${col['column']}"
                               th:value="${param[col['column']]}"
                               th:id="${'search_' + col['column']}"/>
                    </div>
                </div>
            </div>

            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-sm">Search</button>
                <a th:href="@{${requestUri}}" class="btn btn-secondary btn-sm">Reset</a>
            </div>
        </form>
    </div>

    <div class="d-flex justify-content-end mb-3 gap-2">
        <button id="deleteSelectedBtn" class="btn btn-danger" style="display:none;" onclick="deleteSelected()">Delete All Selected</button>
        <button id="exportSelectedBtn" class="btn btn-primary" onclick="exportSelected()">Export</button>
    </div>

    <!-- Bổ sung phần table header và body -->
    <div class="ant-table">
        <table id="table-resize1" class="table table-bordered mb-0">
            <thead>
            <tr>
                <!-- Checkbox "select all" -->
                <th>
                    <input type="checkbox" id="checkAll">
                </th>

                <th th:each="col : ${table.columns}" th:text="${col['title']}"></th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="record : ${table.records}">
                <!-- Checkbox mỗi dòng -->
                <td>
                    <input type="checkbox" class="row-checkbox" th:value="${@fieldUtil.getPrimaryKeyValue(record)}">
                </td>

                <td th:each="col : ${table.columns}">
                <span th:switch="${col['type']}">

                    <!-- LocalDate -->
                    <span th:case="'date'"
                          th:text="${#temporals.format(@fieldUtil.get(record, col['field']), 'dd/MM/yyyy')}">
                    </span>

                    <!-- LocalDateTime -->
                    <span th:case="'datetime'"
                          th:text="${#temporals.format(@fieldUtil.get(record, col['field']), 'dd/MM/yyyy HH:mm')}">
                    </span>

                    <!-- Boolean -->
                    <span th:case="'boolean'">
                        <span th:if="${@fieldUtil.get(record, col['field'])}" class="badge-status status-ok">Yes</span>
                        <span th:if="${!@fieldUtil.get(record, col['field'])}" class="badge-status status-down">No</span>
                    </span>

                    <!-- Number -->
                    <span th:case="'number'"
                          th:text="${@fieldUtil.get(record, col['field']) == 0
                               ? ''
                               : #numbers.formatDecimal(@fieldUtil.get(record, col['field']), 0, 'COMMA', 2, 'POINT')}">
                    </span>

                    <!-- Currency -->
                    <span th:case="'currency'"
                          th:text="${@fieldUtil.get(record, col['field']) == 0
                               ? ''
                               : #numbers.formatDecimal(@fieldUtil.get(record, col['field']), 0, 'COMMA', 2, 'POINT')}">
                    </span>

                    <!-- Default (string, text, etc.) -->
                    <span th:case="*"
                          th:text="${@fieldUtil.get(record, col['field'])}">
                    </span>

                </span>
                </td>

                <td>
                    <div class="actions">
                        <a th:href="@{${requestUri} + '/edit/' + ${@fieldUtil.getPrimaryKeyValue(record)}}" class="btn btn-primary">Edit</a>
                        <button type="submit" class="btn btn-danger"
                                th:attr="data-url=@{${requestUri} + '/delete/' + ${@fieldUtil.getPrimaryKeyValue(record)}}"
                                onclick="return showConfirmation(this)">Delete</button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="pagination-container d-flex justify-content-between align-items-center p-2 border-top bg-light rounded-bottom">

            <!-- Nút phân trang bên trái -->
            <nav th:if="${table.totalPages > 1}">
                <ul class="pagination mb-0">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${table.first}? 'disabled'">
                            <a class="page-link" th:href="@{${requestUri}(page=0, size=${table.size})} + (${#strings.arrayJoin(params.entrySet(), '&')} != '' ? '&' + ${#strings.arrayJoin(params.entrySet(), '&')} : '')">Đầu</a>
                        </li>

                        <li class="page-item" th:classappend="${table.first}? 'disabled'">
                            <a class="page-link" th:href="@{${requestUri}(page=${table.number - 1}, size=${table.size})} + (${#strings.arrayJoin(params.entrySet(), '&')} != '' ? '&' + ${#strings.arrayJoin(params.entrySet(), '&')} : '')">Trước</a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(pageStart, pageEnd)}"
                            th:classappend="${table.number == i} ? 'active'">
                            <a class="page-link" th:href="@{${requestUri}(page=${i}, size=${table.size})} + (${#strings.arrayJoin(params.entrySet(), '&')} != '' ? '&' + ${#strings.arrayJoin(params.entrySet(), '&')} : '')" th:text="${i + 1}"></a>
                        </li>

                        <li class="page-item" th:classappend="${table.last}? 'disabled'">
                            <a class="page-link" th:href="@{${requestUri}(page=${table.number + 1}, size=${table.size})} + (${#strings.arrayJoin(params.entrySet(), '&')} != '' ? '&' + ${#strings.arrayJoin(params.entrySet(), '&')} : '')">Tiếp</a>
                        </li>

                        <li class="page-item" th:classappend="${table.last}? 'disabled'">
                            <a class="page-link" th:href="@{${requestUri}(page=${table.totalPages - 1}, size=${table.size})} + (${#strings.arrayJoin(params.entrySet(), '&')} != '' ? '&' + ${#strings.arrayJoin(params.entrySet(), '&')} : '')">Cuối</a>
                        </li>
                    </ul>
                </ul>
            </nav>

            <!-- Phần bên phải: số bản ghi + dropdown chọn size -->
            <div class="d-flex align-items-center gap-2 ms-auto">
                <div class="text-muted small">
                    Hiển thị từ
                    <span th:text="${table.number * table.size + 1}"></span>
                    đến
                    <span th:text="${table.number * table.size + table.numberOfElements}"></span>
                    của
                    <span th:text="${table.totalElements}"></span> bản ghi
                </div>

                <!-- Dropdown chọn số bản ghi mỗi trang -->
                <form th:action="@{${requestUri}}" method="get">
                    <input type="hidden" name="page" value="0"/>
                    <input type="hidden" th:each="p : ${params}"
                           th:name="${p.key}" th:value="${p.value}"/>
                    <select name="size" class="form-select form-select-sm"
                            onchange="this.form.submit()">
                        <option th:value="5" th:selected="${table.size == 5}">5 / trang</option>
                        <option th:value="10" th:selected="${table.size == 10}">10 / trang</option>
                        <option th:value="20" th:selected="${table.size == 20}">20 / trang</option>
                        <option th:value="50" th:selected="${table.size == 50}">50 / trang</option>
                    </select>
                </form>
            </div>
        </div>
    </div>
</section>
<script>

    document.querySelectorAll('.row-checkbox').forEach(cb => {
        cb.addEventListener('change', updateActionButtons);
    });

    document.getElementById('checkAll').addEventListener('change', function() {
        const checkboxes = document.querySelectorAll('.row-checkbox');
        checkboxes.forEach(cb => cb.checked = this.checked);
        updateActionButtons();
    });

    function updateActionButtons() {
        const checkboxes = document.querySelectorAll('.row-checkbox');
        const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');

        const display = checkedBoxes.length > 0 ? 'inline-block' : 'none';
        document.getElementById('deleteSelectedBtn').style.display = display;

        const master = document.getElementById('checkAll');
        master.checked = checkedBoxes.length === checkboxes.length;
    }

    function exportSelected() {
        const selected = Array.from(document.querySelectorAll('.row-checkbox:checked'))
            .map(cb => cb.value);

        if(selected.length === 0) return;

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '@{/export-multiple}';
        selected.forEach(id => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'ids';
            input.value = id;
            form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
    }

    function showConfirmation(element) {
        const url = element.getAttribute("data-url");
        showConfirm("Bạn có chắc chắn muốn xoá bản ghi này không?", () => {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = url;
            document.body.appendChild(form);
            form.submit()
        });
    }

    function deleteSelected() {
        const selected = Array.from(document.querySelectorAll('.row-checkbox:checked'))
            .map(cb => cb.value);

        if(selected.length === 0) return;

        showConfirm(`Bạn có chắc chắn muốn xóa ${selected.length} bản ghi đã chọn không?`, () => {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '@{/delete-multiple}';
            selected.forEach(id => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'ids';
                input.value = id;
                form.appendChild(input);
            });
            document.body.appendChild(form);
            form.submit();
        });
    }
</script>
</body>
</html>
