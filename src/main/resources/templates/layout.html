<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Insight Monitor</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="/bootstrap-icons-1.10.5/font/bootstrap-icons.css" rel="stylesheet"></head>
<style>
    .nav-link {
        transition: background-color 0.3s ease, color 0.3s ease;
        border-radius: 0.375rem;
        padding: 0.5rem 1rem;
    }

    .nav-link.active {
        background-color: #0d6efd !important; /* Bootstrap primary */
        color: #fff !important;
        font-weight: 500;
    }

    .nav-link:hover {
        background-color: #e9ecef;
        color: #0d6efd;
    }

    .nav-item {
        margin-bottom: 0.25rem;
    }

    .main-content {
        display: flex;
        flex-direction: column;
    }

    .content-area {
        flex-grow: 1;
        padding: 1.5rem;
        overflow-y: auto;
        background-color: #f8f9fa;
        min-height: calc(100vh - 87px);
    }

    footer {
        height: 40px;
        background-color: #f8f9fa;
        text-align: center;
        line-height: 40px;
        font-size: 0.85rem;
        border-top: 1px solid #dee2e6;
        position: sticky;
        bottom: 0;
    }
</style>
<script>
    function showToast(message, isError = false) {
        const toastEl = document.getElementById('custom-toast');
        const toastBody = document.getElementById('toast-message');

        toastBody.innerText = message;

        if (isError) {
            // Màu đỏ than đậm (đẹp và không chói)
            toastEl.style.backgroundColor = '#e2777f';
            toastEl.style.color = '#d1e7ff';
        } else {
            // Màu xanh navy xám đậm (rất dễ nhìn)
            toastEl.style.backgroundColor = '#3293dc';
            toastEl.style.color = '#d1e7ff';
        }

        // Hiển thị toast
        const toast = new bootstrap.Toast(toastEl);
        toast.show();
    }
</script>
<body class="d-flex">

<!-- Sidebar -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Main Content Area -->
<div class="flex-grow-1">
    <div class="main-content">
        <header class="d-flex justify-content-between align-items-center px-4 py-2 shadow-sm bg-white border-bottom">
            <!-- Left: Notifications -->
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-bell-fill text-primary" style="font-size: 1.2rem;"></i>
                <span class="fw-semibold text-dark">Notifications</span>
            </div>

            <!-- Right: User dropdown -->
            <div class="dropdown">
                <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" role="button"
                   id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle me-1" style="font-size: 1.2rem;"></i>
                    <span th:text="${session.user.fullName}">User Name</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                    <li>
                        <a class="dropdown-item" th:href="@{/profile}">Profile</a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item text-danger" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </header>

        <div class="content-area">
            <div th:replace="${view} :: content"></div>
        </div>
        <footer>
            &copy; 2025 Insight Monitor. All rights reserved.
        </footer>
    </div>
</div>
<!-- Spinner overlay -->
<div id="loading-overlay"
     class="position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-white bg-opacity-75"
     style="z-index: 9999; display: none !important;">
    <div class="spinner-border text-primary" role="status" style="width: 2.5rem; height: 2.5rem;">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<!-- Toast Container -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1050">
    <div id="custom-toast" class="toast align-items-center text-white border-0" role="alert"
         aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toast-message">
                <!-- Nội dung toast sẽ được cập nhật ở đây -->
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="/webjars/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="/webjars/stomp-websocket/2.3.4/stomp.min.js"></script>
<script src="/js/bootstrap.bundle.min.js"></script>

<script>
    function showGlobalSpinner() {
        const sidebarSpinner = document.getElementById("sidebar-loading");
        if (sidebarSpinner) sidebarSpinner.classList.remove("d-none");
    }

    function hideGlobalSpinner() {
        const sidebarSpinner = document.getElementById("sidebar-loading");
        if (sidebarSpinner) sidebarSpinner.classList.add("d-none");
    }


    document.addEventListener('DOMContentLoaded', () => {
        const allForms = document.querySelectorAll('form');
        allForms.forEach(form => {
            form.addEventListener('submit', () => {
                showGlobalSpinner();
            });
        });

        const navLinks = document.querySelectorAll('a.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                const href = link.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('javascript')) {
                    showGlobalSpinner();
                }
            });
        });
    });

</script>

</body>
</html>
