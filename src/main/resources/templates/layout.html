<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: common-head(pageTitle=${pageTitle})}"></head>
<style>

    .collapse-animated {
        transition: height 0.3s ease, opacity 0.3s ease;
        overflow: hidden;
    }

    .nav .sub-menu {
        margin-top: 0.25rem;
    }

    .nav .sub-menu .nav-link {
        font-size: 0.95em;
        color: #555;
        padding-left: 1.5rem;
        border-left: 2px solid transparent;
        transition: all 0.2s;
    }

    .nav .sub-menu .nav-link:hover {
        color: #000;
        border-left: 2px solid #007bff;
    }

    .nav .sub-menu .nav-link.active {
        color: #007bff;
        font-weight: 500;
    }

    .nav-link[aria-expanded="true"] .bi-chevron-down {
        transform: rotate(180deg);
        transition: transform 0.3s;
    }

    .nav .nav-link:hover {
        color: #007bff;
        background-color: rgba(0,123,255,0.1);
        border-radius: 0.25rem;
    }

    .nav-link {
        transition: background-color 0.3s ease, color 0.3s ease;
        border-radius: 0.375rem;
        padding: 0.5rem 1rem;
    }

    .nav-link.active {
        background-color: #0d6efd !important; /* Bootstrap primary */
        color: #fff !important;
        font-weight: 500;
    }

    .nav-link:hover {
        background-color: #e9ecef;
        color: #0d6efd;
        border-left: 2px solid #007bff;
    }

    .nav-item {
        margin-bottom: 0.25rem;
    }

    .main-content {
        display: flex;
        flex-direction: column;
    }

    .content-area {
        flex-grow: 1;
        padding: 1.5rem;
        overflow-y: auto;
        background-color: #f8f9fa;
        min-height: calc(100vh - 87px);
    }

    footer {
        height: 40px;
        background-color: #f8f9fa;
        text-align: center;
        line-height: 40px;
        font-size: 0.85rem;
        z-index: 1000;
        border-top: 1px solid #dee2e6;
        position: sticky;
        bottom: 0;
    }
</style>
<script>

</script>
<body class="d-flex">

<!-- Sidebar -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Main Content Area -->
<div class="flex-grow-1">
    <div class="main-content">
        <header class="d-flex justify-content-between align-items-center px-4 py-2 shadow-sm bg-white border-bottom">
            <!-- Left: Notifications -->
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-bell-fill text-primary" style="font-size: 1.2rem;"></i>
                <span class="fw-semibold text-dark">Notifications</span>
            </div>

            <!-- Right: User dropdown -->
            <div class="dropdown">
                <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" role="button"
                   id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false"
                   th:if="${session.user != null}">
                    <i class="bi bi-person-circle me-1" style="font-size: 1.2rem;"></i>
                    <span th:text="${session.user.fullName}">User Name</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                    <li>
                        <a class="dropdown-item" th:href="@{/profile}">Profile</a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item text-danger" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </header>

        <div class="content-area">
            <div th:replace="${view} :: content"></div>
        </div>
        <footer>
            &copy; 2025 Insight Monitor. All rights reserved.
        </footer>
    </div>
</div>
<!-- Spinner overlay -->
<div id="loading-overlay"
     class="position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-white bg-opacity-75"
     style="z-index: 9999; display: none !important;">
    <div class="spinner-border text-primary" role="status" style="width: 2.5rem; height: 2.5rem;">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div th:replace="fragments/common :: common-scripts"></div>

</body>
</html>
