<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<head>
    <title>Trạng thái Dịch vụ Nội bộ</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/bootstrap-icons-1.10.5/font/bootstrap-icons.css">
    <style>
        .ant-table {
            background-color: #fff;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .ant-table thead {
            background-color: #1677ff;
            color: #fff;
        }

        .ant-table th {
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
            color: white;
            background-color: cornflowerblue;
        }

        .ant-table td {
            font-size: 14px;
            text-align: center;
            padding: 10px;
            vertical-align: middle;
        }

        .ant-table tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .ant-table tbody tr:hover {
            background-color: #e9ecef;
        }

        .badge-status {
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 0.35rem;
            display: inline-block;
            font-weight: 500;
        }

        .status-ok {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .status-down {
            background-color: #f8d7da;
            color: #842029;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #1677ff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .section-title i {
            margin-right: 8px;
        }

        .pagination-container {
            background-color: #f8f9fa;
            border-radius: 0 0 0.75rem 0.75rem;
            padding: 10px;
        }

        .pagination .page-link {
            border-radius: 0.375rem !important;
            margin: 0 4px;
            font-size: 0.875rem;
            padding: 0.35rem 0.7rem;
        }
    </style>
</head>

<section class="container-fluid mt-4">
    <div class="section-title">
        <i class="bi bi-activity"></i> Trạng thái Dịch vụ Nội bộ
    </div>
    <p class="text-muted">Theo dõi tình trạng hoạt động của các URL nội bộ.</p>

    <div class="ant-table">
        <table class="table table-bordered mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>URL</th>
                <th>Loại</th>
                <th>Mô tả</th>
                <th>Trạng thái</th>
                <th>Lần kiểm tra cuối</th>
                <th>Phản hồi</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="url : ${urlPage.content}">
                <td th:text="${url.id}"></td>
                <td th:text="${url.url}"></td>
                <td th:text="${url.type != null ? url.type : 'API'}"></td>
                <td th:text="${url.description != null ? url.description : 'Không có mô tả'}"></td>
                <td>
                    <span th:if="${url.reachable}" class="badge-status status-ok">Hoạt động</span>
                    <span th:if="${!url.reachable}" class="badge-status status-down">Ngừng</span>
                </td>
                <td th:text="${#temporals.format(url.lastChecked, 'dd/MM/yyyy HH:mm:ss')}"></td>
                <td th:text="${url.responseTime != null ? url.responseTime + ' ms' : 'Không rõ'}"></td>
            </tr>
            </tbody>
        </table>

        <!-- Pagination + Footer -->
        <div class="pagination-container d-flex justify-content-between align-items-center p-2 border-top bg-light rounded-bottom">

            <!-- Nút phân trang bên trái -->
            <nav th:if="${urlPage.totalPages > 1}">
                <ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${urlPage.first}? 'disabled'">
                        <a class="page-link" th:href="@{/dashboard(page=${urlPage.number - 1}, size=${urlPage.size})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, urlPage.totalPages - 1)}"
                        th:classappend="${urlPage.number == i}? 'active'">
                        <a class="page-link" th:href="@{/dashboard(page=${i}, size=${urlPage.size})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${urlPage.last}? 'disabled'">
                        <a class="page-link" th:href="@{/dashboard(page=${urlPage.number + 1}, size=${urlPage.size})}">Tiếp</a>
                    </li>
                </ul>
            </nav>

            <!-- Phần bên phải: số bản ghi + dropdown chọn size -->
            <div class="d-flex align-items-center gap-2 ms-auto">
                <div class="text-muted small">
                    Hiển thị từ
                    <span th:text="${urlPage.number * urlPage.size + 1}"></span>
                    đến
                    <span th:text="${urlPage.number * urlPage.size + urlPage.numberOfElements}"></span>
                    của
                    <span th:text="${urlPage.totalElements}"></span> bản ghi
                </div>

                <!-- Dropdown chọn số bản ghi mỗi trang -->
                <form th:action="@{/dashboard}" method="get">
                    <input type="hidden" name="page" value="0"/>
                    <select name="size" class="form-select form-select-sm"
                            onchange="this.form.submit()">
                        <option th:value="5" th:selected="${urlPage.size == 5}">5 / trang</option>
                        <option th:value="10" th:selected="${urlPage.size == 10}">10 / trang</option>
                        <option th:value="20" th:selected="${urlPage.size == 20}">20 / trang</option>
                        <option th:value="50" th:selected="${urlPage.size == 50}">50 / trang</option>
                    </select>
                </form>
            </div>
        </div>
    </div>
</section>

</html>
