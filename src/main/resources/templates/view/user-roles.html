<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Roles Tree View</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; }
        .sidebar { width: 200px; background: #f4f4f4; padding: 10px; }
        .sidebar a { display: block; padding: 8px; color: black; text-decoration: none; }
        .sidebar a:hover { background: #ddd; }
        .content { flex: 1; padding: 20px; }
        .role { margin-top: 15px; }
        .permission { margin-left: 20px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Users</h3>
    <div th:each="user : ${users}">
        <a th:href="@{/user-roles(selected=${user})}"
           th:text="${user}"
           th:classappend="${selectedUser} == ${user} ? 'active' : ''"></a>
    </div>
</div>

<div class="content">
    <h2 th:text="'Selected User: ' + (${selectedUser} ?: 'None')"></h2>

    <div th:if="${roles != null}">
        <div th:each="roleEntry : ${roles}">
            <div class="role">
                <strong th:text="${roleEntry.key}"></strong>
                <div th:each="perm : ${roleEntry.value}" class="permission">
                    <span th:text="${perm}"></span>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${roles == null}">
        <p>Please select a user to view roles and permissions.</p>
    </div>
</div>

</body>
</html>
