<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: common-head"></head>
    <style>
        body {
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #fff;
            padding: 2rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 0.3rem 0.6rem rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            font-weight: 700;
            color: #0d6efd;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,.25);
        }

        .btn-login {
            background-color: #0d6efd;
            color: #fff;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #0b5ed7;
            color: #fff;
        }

        .text-danger {
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
        }

        .footer-text {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <div class="mb-3">
        <span style="font-size: 2.5rem;">🛡️</span>
    </div>
    <h2 style="font-weight: 700; color: #0d6efd; letter-spacing: 1px; margin-bottom: 1.5rem;">
        Secure Access
    </h2>
    <form th:action="@{/login}" method="post">
        <input type="hidden" name="redirect" th:value="${redirect}">
        <div class="mb-3">
            <input type="text" name="accessKey" class="form-control" placeholder="Enter Access Key" required>
        </div>
        <button type="submit" class="btn btn-login w-100 mt-2">Login</button>
    </form>
    <div class="footer-text">Use your access key to continue</div>
</div>

<div th:replace="fragments/common :: common-scripts"></div>

</body>
</html>
